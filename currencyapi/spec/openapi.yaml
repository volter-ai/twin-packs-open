    CurrencyRate:
      type: object
      description: A single currency rate entry.
      properties:
        code:
          $ref: '#/components/schemas/CurrencyCode'
        value:
          type: number
          description: The conversion rate relative to the base currency.
          example: 3.67306
      required:
        - code
        - value
    RatesMap:
      type: object
      description: Map of currency code to its rate entry.
      additionalProperties:
        $ref: '#/components/schemas/CurrencyRate'
    ExchangeRatesResponse:
      type: object
      description: Standard rates response used by latest, historical and convert.
      properties:
        meta:
          type: object
          properties:
            last_updated_at:
              type: string
              format: date-time
              description: When this dataset was last updated (ISO 8601, UTC).
              example: "2023-06-23T10:15:59Z"
          required:
            - last_updated_at
        data:
          $ref: '#/components/schemas/RatesMap'
      required:
        - meta
        - data
    RangeResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              datetime:
                type: string
                format: date-time
                description: The datetime this interval's rates apply to.
                example: "2022-01-01T23:59:59Z"
              currencies:
                $ref: '#/components/schemas/RatesMap'
            required:
              - datetime
              - currencies
      required:
        - data
    CurrencyInfo:
      type: object
      properties:
        symbol:
          type: string
          example: "AED"
        name:
          type: string
          example: "United Arab Emirates Dirham"
        symbol_native:
          type: string
          example: "د.إ"
        decimal_digits:
          type: integer
          example: 2
        rounding:
          type: number
          example: 0
        code:
          $ref: '#/components/schemas/CurrencyCode'
        name_plural:
          type: string
          example: "UAE dirhams"
        type:
          type: string
          enum:
            - fiat
            - metal
            - crypto
        countries:
          type: array
          description: ISO 3166-1 alpha-2 country codes that use this currency.
          items:
            type: string
          example:
            - "AE"
    CurrenciesResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CurrencyInfo'
      required:
        - data
    CountriesResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            type: object
      required:
        - data
    StatusResponse:
      type: object
      properties:
        account_id:
          type: integer
          description: Your account (team) id.
          example: 313373133731337
        quotas:
          type: object
          properties:
            month:
              $ref: '#/components/schemas/QuotaBucket'
            grace:
