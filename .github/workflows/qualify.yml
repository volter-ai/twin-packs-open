name: Qualify selected production pack
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Vendor directory to build and qualify
        required: true
        default: tavily
        type: string
permissions:
  contents: read
concurrency:
  group: independent-pack-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PACK_VENDOR: ${{ inputs.vendor }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build through an owned World
        run: bun scripts/run-world.ts build
      - name: Qualify through an owned World
        run: bun scripts/run-world.ts assess
      - name: Retain publisher qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: warn
