name: Release independent pack
run-name: Publish prepared twin ${{ inputs.vendor }}
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Prepared vendor directory
        required: true
        type: string
      preparation_tag:
        description: GitHub release retaining the reviewed archive and preparation.json
        required: true
        type: string
      preparation_sha256:
        description: Exact preparation.json digest named in the release permission
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: independent-pack-publication-${{ inputs.vendor }}
  cancel-in-progress: false
jobs:
  release:
    if: vars.PACK_PUBLISH_ENABLED == 'true' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      PACK_VENDOR: ${{ inputs.vendor }}
      PACK_PREPARATION_TAG: ${{ inputs.preparation_tag }}
      PACK_PREPARATION_SHA256: ${{ inputs.preparation_sha256 }}
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      # Preparation, assessment, propagation, submission and proposal run outside CI.
      - name: Upload the exact reviewed archive with npm provenance
        timeout-minutes: 1
        shell: bash
        run: |
          timeout 45s bash -euo pipefail <<'PUBLISH'
          mkdir -p "$RUNNER_TEMP/publisher-source"
          gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/publisher-source.tgz"
          tar -xzf "$RUNNER_TEMP/publisher-source.tgz" -C "$RUNNER_TEMP/publisher-source" --strip-components=1
          cd "$RUNNER_TEMP/publisher-source"
          node scripts/publish.mjs --upload-only
          PUBLISH
